<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/productlist.css" />
    <script src="scripts/list.js" defer></script>
    <title>Product List</title>
  </head>
  <body>
    <header>
      <div class="header_content">
        <h1>Products</h1>
        <p>This is the good stuff you should buy</p>
        <p>You love buy!</p>
      </div>
    </header>

    <main>
      <div class="list_button back_button">Go Back!</div>

      <h2>Nike</h2>
      <p>Products from Nike</p>
      
      <div class="filter_gender_buttons_container">
        <div data-filter="All" class="list_button selcted">All</div>
        <div data-filter="Unisex" class="list_button">Unisex</div>
        <div data-filter="Women" class="list_button">Women</div>
        <div data-filter="Men" class="list_button">Men</div>
      </div>
      
      <div class="filter_season_buttons_container">
        <div data-season="Summer" class="list_button">Summer</div>
        <div data-season="Fall" class="list_button">Fall</div>
        <div data-season="Winter" class="list_button">Winter</div>
        <div data-season="Spring" class="list_button">Spring</div>
      </div>

      <div class="list_button sort_button">Sorter efter pris, faldende</div>
      
      <div class="product_list_container"></div>
    </main>
  </body>
</html>
